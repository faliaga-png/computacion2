services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CANT_WORKERS: "4"
      TIMEOUT_POR_DEFECTO: "60"
      USAR_EXECUTOR: "true"
      TAMANO_COLA: "1000"
      LIMITE_APAGADO: "10"
      DIRECTORIO_VOLCADOS: "/app/volcados"
    volumes:
      # Los volcados estado_<timestamp>.json quedan en tp2/volcados del host
      - ./volcados:/app/volcados
    # Más tiempo que LIMITE_APAGADO para que el apagado ordenado termine
    # antes de que Docker mande SIGKILL.
    stop_grace_period: 20s
